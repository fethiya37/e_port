name: e_port
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.1
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  jwt_decode: ^0.3.1
  ethiopian_calendar_plus: ^1.0.6
  http: ^1.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/icons/chapa.png
    - assets/icons/telebirr.png
    - assets/icons/chapaa.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#87CEFA"   
  adaptive_icon_foreground: "assets/icon.png"